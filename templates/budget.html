<!DOCTYPE html>
<html>
<head>
<title>Budget Calculator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h1>💸 Budget Calculator</h1>

<form method="POST">

{% csrf_token %}

<input type="number" name="hotel" class="form-control" placeholder="Hotel Cost">

<br>

<input type="number" name="food" class="form-control" placeholder="Food Cost">

<br>

<input type="number" name="transport" class="form-control" placeholder="Transport Cost">

<br>

<button class="btn btn-success">
Calculate
</button>

</form>

{% if total %}

<h2 class="mt-4">
Total Budget: ₹{{ total }}
</h2>

{% endif %}

</div>

</body>
</html>
