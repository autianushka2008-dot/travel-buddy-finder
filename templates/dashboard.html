<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
body{
    background: linear-gradient(135deg, #e0f7fa, #e8eaf6);
}

/* Title */
.title{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin-top:30px;
    color:#1e3c72;
}

/* Card style */
.feature-card{
    border:none;
    border-radius:20px;
    padding:25px;
    text-align:center;
    transition:0.3s;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    background:white;
    height:100%;
}

.feature-card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
    background:#f0f8ff;
}

/* Icon style */
.feature-icon{
    font-size:40px;
    margin-bottom:10px;
    color:#1e3c72;
}

/* Button link */
.feature-link{
    text-decoration:none;
    color:black;
}
</style>

</head>

<body>

<div class="container">

    <div class="title">
        🌍 AI Travel Buddy Dashboard
    </div>

    <div class="row mt-4 g-4">

        <!-- Cards Start -->

        <div class="col-md-3">
            <a href="{% url 'trip' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-airplane"></i></div>
                <h5>Create Trip</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'find_buddy' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-people"></i></div>
                <h5>Find Buddy</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'map' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-geo-alt"></i></div>
                <h5>Travel Map</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'expense' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-cash-stack"></i></div>
                <h5>Expense</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'hotels' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-building"></i></div>
                <h5>Hotels</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'restaurants' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-cup-hot"></i></div>
                <h5>Restaurants</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'attractions' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-camera"></i></div>
                <h5>Attractions</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'weather' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-cloud-sun"></i></div>
                <h5>Weather</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'transport' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-bus-front"></i></div>
                <h5>Transport</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'itinerary' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-calendar-check"></i></div>
                <h5>Itinerary</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'packing' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-bag"></i></div>
                <h5>Packing List</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'ai_trip_planner' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-cpu"></i></div>
                <h5>AI Planner</h5>
            </div>
            </a>
        </div>

        <div class="col-md-3">
            <a href="{% url 'profile' %}" class="feature-link">
            <div class="feature-card">
                <div class="feature-icon"><i class="bi bi-person-circle"></i></div>
                <h5>Profile</h5>
            </div>
            </a>
        </div>

    </div>

    <!-- Logout -->
    <div class="text-center mt-5 mb-4">
        <a href="{% url 'logout' %}" class="btn btn-danger px-4 py-2">
            🚪 Logout
        </a>
    </div>

</div>

</body>
</html>
