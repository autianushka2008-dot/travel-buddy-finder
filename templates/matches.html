{% extends 'base.html' %}

{% block content %}

<h2>AI Travel Matches</h2>

{% for match in matches %}

<div class="card p-3 mb-3">

<h4>

{{ match.user.username }}

</h4>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<p>

Compatibility:
{{ match.score }}%

</p>

<a href="/send-request/{{match.id}}"
class="btn btn-primary">

Send Request

</a>

</div>

{% endfor %}

{% endblock %}
