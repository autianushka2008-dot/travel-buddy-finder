<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:url("https://images.unsplash.com/photo-1488646953014-85cb44e25828");
    background-size:cover;
    height:100vh;
}

.login-box{

    width:400px;

    margin:auto;

    margin-top:100px;

    padding:35px;

    background:rgba(255,255,255,0.2);

    backdrop-filter:blur(10px);

    border-radius:20px;

    color:white;
}

h1{
    text-align:center;
    font-weight:bold;
    margin-bottom:25px;
}

.btn-custom{

    width:100%;

    padding:12px;

    font-size:20px;

    font-weight:bold;

    border-radius:10px;
}

</style>

</head>

<body>

<div class="login-box">

<h1>✈️ Travel Buddy Login</h1>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="username"
placeholder="Username"
class="form-control mb-3">

<input
type="password"
name="password"
placeholder="Password"
class="form-control mb-3">

<button
type="submit"
class="btn btn-success btn-custom">

Login

</button>

</form>

<br>

<a href="/register/"
class="btn btn-warning btn-custom">

Create New Account

</a>

</div>

</body>
</html>
