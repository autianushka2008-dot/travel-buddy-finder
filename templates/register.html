<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");
    background-size:cover;
    background-position:center;
    height:100vh;
}

.register-box{
    width:450px;
    margin:auto;
    margin-top:70px;
    padding:30px;

    background:rgba(255,255,255,0.2);

    backdrop-filter:blur(10px);

    border-radius:20px;

    color:white;
}

.btn-custom{
    width:100%;
    font-size:20px;
    font-weight:bold;
    padding:12px;
    border-radius:10px;
}

h1{
    text-align:center;
    font-weight:bold;
    margin-bottom:25px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:none;
    margin-top:5px;
}

</style>

</head>

<body>

<div class="register-box">

<h1>🌍 Travel Buddy Register</h1>
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-warning">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
<!-- ONLY ONE FORM -->
<form method="POST">

    {% csrf_token %}

    <!-- Full Name -->
    <label>👤 Full Name</label>
    <input type="text"
           name="fullname"
           placeholder="Enter your full name"
           required>

    <br>

    <!-- Username -->
    <label>🆔 Username</label>
    <input type="text"
           name="username"
           placeholder="Choose a username"
           required>

    <br>

    <!-- Email -->
    <label>📧 Email</label>
    <input type="email"
           name="email"
           placeholder="Enter your email"
           required>

    <br>

    <!-- Password -->
    <label>🔒 Password</label>
    <input type="password"
           name="password"
           placeholder="Enter password"
           required>

    <br>

    <!-- Confirm Password -->
    <label>🔒 Confirm Password</label>
    <input type="password"
           name="confirm_password"
           placeholder="Re-enter password"
           required>

    <br><br>

    <!-- Register Button -->
    <button type="submit"
            class="btn btn-warning btn-custom">
        Register
    </button>

</form>

<br>

<a href="/login/"
   class="btn btn-light btn-custom">
    Already Have Account?
</a>

</div>

</body>
</html>
