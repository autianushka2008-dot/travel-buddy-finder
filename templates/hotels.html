<!DOCTYPE html>
<html>

<head>

    <title>Hotel Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .hotel-card{
            border:none;
            border-radius:15px;
            margin-top:15px;
        }

        .title{
            text-align:center;
            margin-top:30px;
            margin-bottom:30px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1 class="title">
        🏨 Hotel Finder
    </h1>

    <div class="card shadow p-4">

        <form method="POST">

            {% csrf_token %}

            <label class="form-label">
                Select Destination
            </label>

            <select
                name="destination"
                class="form-control">

                <option>Goa</option>
                <option>Pune</option>
                <option>Mumbai</option>
                <option>Delhi</option>
                <option>Jaipur</option>
                <option>Udaipur</option>
                <option>Manali</option>
                <option>Shimla</option>
                <option>Kashmir</option>
                <option>Lonavala</option>
                <option>Mahabaleshwar</option>
                <option>Bangalore</option>
                <option>Hyderabad</option>
                <option>Chennai</option>
                <option>Kolkata</option>
                <option>Agra</option>
                <option>Rishikesh</option>
                <option>Darjeeling</option>
                <option>Mysore</option>
                <option>Ooty</option>

            </select>

            <br>

            <button
                class="btn btn-primary w-100">

                Find Hotels

            </button>

        </form>

    </div>

    {% if hotels %}

        <h2 class="mt-5">
            Available Hotels
        </h2>

        {% for hotel in hotels %}

        <div class="card hotel-card shadow p-4">

            <h3>
                {{ hotel.name }}
            </h3>

            <p>
                ⭐ Rating:
                {{ hotel.rating }}
            </p>

            <p>
                💰 Price:
                {{ hotel.price }}
            </p>

            <button
                class="btn btn-success">

                Book Now

            </button>

        </div>

        {% endfor %}

    {% endif %}

</div>

</body>

</html>
