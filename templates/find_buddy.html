<!DOCTYPE html>
<html>
<head>
    <title>Travel Buddy Matches</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1>Travel Buddy Matches</h1>

    {% for match in matches %}

    <div class="card p-3 mt-3">

        <h3>{{ match.user.username }}</h3>

        <p>City: {{ match.city }}</p>

        <p>Travel Style: {{ match.travel_style }}</p>

        <h4>Match Score: {{ match.score }}%</h4>

        <a href="/chat/{{ match.user.id }}/"
           class="btn btn-primary">
           Chat
        </a>
        <a href="/send-request/{{ match.user.id }}/"
           class="btn btn-success">
Send Request
        </a> 

    </div>

    {% endfor %}

</div>

</body>
</html>
